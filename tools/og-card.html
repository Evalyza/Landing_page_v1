<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Instrument+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* Social card 1200x630 · rendered by headless Chrome into diseno-landing/og/og-<lang>.png */
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { background: #0f2b24; color: #f5f1e8; font-family: "Instrument Sans", sans-serif; display: grid; grid-template-columns: 1fr 360px; }
  .copy { padding: 72px 0 64px 80px; display: flex; flex-direction: column; }
  .logo { height: 64px; width: auto; align-self: flex-start; margin-left: -14px; }
  h1 { font-family: "Bricolage Grotesque", sans-serif; font-weight: 700; font-size: 76px; line-height: 1.02; letter-spacing: -0.03em; margin: 56px 0 0; }
  h1 span { display: inline-block; padding-bottom: 6px; background: linear-gradient(#c6f24e, #c6f24e) left bottom / 100% 10px no-repeat; }
  p { margin: auto 0 0; font-size: 28px; line-height: 1.35; color: #a9c4b8; max-width: 20ch; }
  .chips { display: flex; gap: 10px; margin-top: 18px; }
  .chips b { font-weight: 500; font-size: 20px; padding: 8px 16px; border-radius: 999px; background: #163a31; color: #f5f1e8; }
  .mark { display: grid; place-items: center; }
  .mark img { width: 300px; height: 300px; }
</style></head>
<body>
  <div class="copy">
    <img class="logo" src="../diseno-landing/assets/ozmetra-logo-horizontal-blanco.svg" alt="">
    <h1 id="h"></h1>
    <p id="p"></p>
    <div class="chips" id="c"></div>
  </div>
  <div class="mark"><img src="../diseno-landing/assets/ozmetra-simbolo-claro.svg" alt=""></div>
<script>
  const T = {
    es: ["Mira por dentro","a cada startup.","Software con IA para aceleradoras, incubadoras y viveros"],
    en: ["See inside","every startup.","AI software for accelerators, incubators and hubs"],
    fr: ["Voyez de l'intérieur","chaque startup.","Logiciel d'IA pour accélérateurs, incubateurs et pépinières"],
    de: ["Schau in","jedes Startup.","KI-Software für Accelerators, Inkubatoren und Gründerzentren"],
    it: ["Guarda dentro","ogni startup.","Software con IA per acceleratori, incubatori e poli d'impresa"],
  };
  const C = {
    es: ["Selección", "Mentoría", "Continuidad"],
    en: ["Selection", "Mentoring", "Continuity"],
    fr: ["Sélection", "Mentorat", "Continuité"],
    de: ["Auswahl", "Mentoring", "Kontinuität"],
    it: ["Selezione", "Mentoring", "Continuità"],
  };
  // /startups variant: ?v=startups
  const T_ST = {
    es: ["¿Siguen funcionando","vuestros procesos?","Diagnóstico de procesos para startups que han crecido rápido"],
    en: ["Do your processes","still work?","Process diagnosis for fast-growing startups"],
    fr: ["Vos processus","tiennent-ils encore ?","Diagnostic des processus pour startups en forte croissance"],
    de: ["Funktionieren eure","Prozesse noch?","Prozessdiagnose für schnell wachsende Startups"],
    it: ["I vostri processi","funzionano ancora?","Diagnosi dei processi per startup cresciute in fretta"],
  };
  const C_ST = {
    es: ["2 semanas","8 áreas","Plan priorizado"],
    en: ["2 weeks","8 areas","Prioritised plan"],
    fr: ["2 semaines","8 domaines","Plan priorisé"],
    de: ["2 Wochen","8 Bereiche","Priorisierter Plan"],
    it: ["2 settimane","8 aree","Piano prioritizzato"],
  };
  const q = new URLSearchParams(location.search);
  const l = q.get("lang") || "es";
  if (q.get("v") === "startups") { Object.assign(T, T_ST); Object.assign(C, C_ST); }
  document.getElementById("h").innerHTML = `${T[l][0]}<br><span>${T[l][1]}</span>`;
  document.getElementById("p").textContent = T[l][2];
  document.getElementById("c").innerHTML = C[l].map((c) => `<b>${c}</b>`).join("");
</script>
</body></html>
